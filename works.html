<body data-page="works" data-tabs="off">
  <div data-slot="header"></div>
  <h1 class="sr-only">All works by Vitalii Menshenin</h1>
  <main class="all-works" id="all-works" aria-label="All projects"></main>
  <div data-slot="footer"></div>
  <script src="js/layout.js"></script>
  <script>
    /* Все проекты одной плиткой. Обложки — те же файлы, что и везде (coverImg). */
    document.getElementById("all-works").innerHTML = PROJECTS.map((p, i) => `
      <a class="all-works__item" href="project.html?id=${p.id}">
        <div class="media">${coverImg(p, { eager: i < 6 })}</div>
      </a>`).join("");
  </script>
